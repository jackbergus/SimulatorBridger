netconvert_binary: "/usr/bin/netconvert"
place_name: "Bologna"
velocity_unit: "m_per_s"
distance_unit: "meter"
aggregate_edges_to_nodes: no
car_configuration: "ChevyVolt.yaml"
desirability_distribution:
  file_name: "/home/giacomo/PycharmProjects/pythonProject1/data/bolo/max_frail_distribution.csv"
  scaling: 0.0001
  aggregation: "max"
  useScaled: yes
  filter: #GolavFilter
    window_size: 5
    poly_oder: 5
sumo:
  binary: "/usr/bin/sumo"
  config: "/home/giacomo/Scaricati/bolognaringway_1.0/bolognaringway.sumo.cfg"
  net: "/home/giacomo/Scaricati/bolognaringway_1.0/bolognaringway.net.xml"
  begin: 0
  end: 18000
  step: 1
  ignore_links:
    - 'highway.bridleway'
    - 'highway.cycleway'
    - 'highway.footway'
    - 'highway.pedestrian'
    - 'highway.service'
    - 'highway.path'
  allowed:
    - 'evehicle'
pedestrian_fields:
  sensor_id: "Raw ID"
  sensor_name: "Sensor Name"
  lon: "Sensor Centroid Longitude"
  lat: "Sensor Centroid Latitude"
  time: "Timestamp"
  count: "Value"
vehicular_fields:
  sensor_id: "Raw ID"
  sensor_name: "Sensor Name"
  lon: "Sensor Centroid Longitude"
  lat: "Sensor Centroid Latitude"
  time: "Timestamp"
  count: "Value"

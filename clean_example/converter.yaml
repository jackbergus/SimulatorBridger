clazzPath: uk.ncl.giacomobergami.SumoOsmosisBridger.traffic_converter.SUMOConverter # Simulator Class
YAMLConverterConfiguration: clean_example/sumo.yaml # Simulator Configuration for the Class
begin: 0    # Start simulator time
end: 300   # End simulator time
step: 0.075  # needs to be changed to match network latency if match is "true"  in "clean_example/3_extIOTSim_configuration/iot_generators.yaml"                                                                                           # Simulation granularity

#Routing Algorithm
routingAlgorithm: uk.ncl.giacomobergami.components.routing_algorithm.MCFR #choose either "...SPMB" or "...MCFR" to select these algorithms, or choose just "custom" to modify agent_config.json and edge/cloud_generator.yaml files

#MEL processing policy
melProcessing: Quietest #choose either "Nearest" to process incoming communications on the nearest MEL or "Quietest" to process incoming communications in the quietest MEL

## Injected data
isInjectCSVData: false
injectedCSVData: example-injection-data.csv
isInjectJSONData : false
injectedJSONData: PatientDigitalTwin/patient.json

#these used if injected data needs boosted latency
boostLatency: false #true if injected data needs boosted latency
normalLatency: 1.0
boostedLatency: 0.001

## Output
RSUCsvFile:         #dynamically defined
VehicleCsvFile:     #dynamically defined
outputRSUCsvFile: true #true to output this CSV file, false to avoid outputting this file, currently needs to be true for simulator
outputVehicleCsvFile: true #true to output this CSV file, false to avoid outputting this file, currently needs to be true for simulator

## Batch TODO: make this work, this is currently broken
isBatch: false
isFirstBatch: true
queueFilePath: 
  C:\\Users\\rohin\\SimulatorBridger\\SimulatorBridger\\clean_example\\PersistingBatchData\\
batchStart: 0
batchEnd: 20

communicationProtocol:    "uk.ncl.giacomobergami.components.iot_protocol.XMPPProtocol"
networkType:              "uk.ncl.giacomobergami.components.network_type.cellular_5G" #needs to be "custom" if not using a cellular network and then uses values above
stepSizeEditorPath:       "clean_example/step-size.py"
